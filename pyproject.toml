[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kyber-kem"
version = "0.1.0"
description = "Implementation of Kyber Key Encapsulation Mechanism ML-KEM in Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Tomasz Białecki", email = "bialecki.tomasz6@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

# Configuring pytest automatically
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]