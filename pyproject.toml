[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kyber-kem"
version = "0.1.0"
description = "Implementation of Kyber Key Encapsulation Mechanism ML-KEM (NIST FIPS 203) in pure Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Tomasz Białecki", email = "bialecki.tomasz6@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
exclude = ["notebooks"]